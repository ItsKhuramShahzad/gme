[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Audit issue #2: several test modules used to `return True/False` instead of
# asserting. pytest ignores return values, so a False result was reported as a
# PASS and only raised PytestReturnNotNoneWarning. Promote that warning to an
# error so the pattern cannot silently come back.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    slow: long-running optimisation tests (convex roof / integration)
